<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#45464c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Monopoly</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Home: create or join a room -->
  <section id="home" class="screen">
    <div class="panel">
      <h1><span class="logo">MONOPOLY</span><small>2D &amp; 3D · up to 6 players</small></h1>
      <label>Your name
        <input id="name" maxlength="16" autocomplete="nickname" placeholder="e.g. Alex" />
      </label>
      <button id="createBtn" class="primary big">Create a room</button>
      <div class="divider"><span>or join a friend</span></div>
      <div class="row">
        <input id="codeInput" maxlength="4" placeholder="CODE" autocapitalize="characters" autocomplete="off" />
        <button id="joinBtn" class="big">Join</button>
      </div>
      <p class="hint">Everyone opens this page on their own phone. One person creates a room and shares the 4-letter code.</p>
    </div>
  </section>

  <!-- Lobby -->
  <section id="lobby" class="screen hidden">
    <div class="panel">
      <p class="muted">Room code</p>
      <div id="roomCode" class="room-code">----</div>
      <button id="shareBtn">📤 Share invite link</button>
      <h3>Players <span id="playerCount"></span></h3>
      <ul id="lobbyPlayers" class="player-list"></ul>
      <button id="startBtn" class="primary big">Start game</button>
      <p id="lobbyHint" class="hint"></p>
      <button id="leaveBtn" class="link">Leave room</button>
    </div>
  </section>

  <!-- Game -->
  <section id="game" class="screen hidden">
    <div id="stage"></div>
    <header id="topbar">
      <div id="chips"></div>
    </header>
    <div id="notice" class="hidden"></div>
    <div id="toolbar">
      <button id="modeBtn" title="Switch to 3D board">3D</button>
      <button id="viewBtn" title="Reset view" class="hidden">🎯</button>
      <button id="logBtn" title="Log & chat">💬<span id="chatDot" class="dot hidden"></span></button>
      <button id="menuBtn" title="Menu">☰</button>
    </div>
    <div id="hud">
      <div id="status"></div>
      <div id="actions"></div>
      <div id="secondary">
        <button id="propsBtn">🏠 My properties</button>
        <button id="tradeBtn">🤝 Trade</button>
      </div>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="toasts"></div>
  <div id="conn" class="hidden">Reconnecting…</div>

  <script src="/socket.io/socket.io.min.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
