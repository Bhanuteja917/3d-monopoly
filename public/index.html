<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#2a3cff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Global Biz" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Global Business</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.min.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <!-- Home -->
    <section id="screen-home" class="screen menu-screen active">
      <div class="menu-card home-card">
        <div class="logo"><span class="logo-globe">🌍</span><h1><span>GLOBAL</span><span>BUSINESS</span></h1></div>
        <p class="tagline" data-s="tagline"></p>
        <div class="menu-buttons">
          <button class="btn btn-yellow btn-big" id="btn-pass" data-s="passPlay"></button>
          <button class="btn btn-green hidden" id="btn-resume" data-s="resume"></button>
          <button class="btn btn-blue" id="btn-create" data-s="createRoom"></button>
          <button class="btn btn-blue" id="btn-join" data-s="joinRoom"></button>
          <button class="btn btn-purple hidden" id="btn-rejoin"></button>
          <button class="btn btn-ghost" id="btn-settings" data-s="settings"></button>
          <button class="btn btn-green hidden" id="btn-install" data-s="installApp"></button>
        </div>
        <div class="character-parade" id="parade"></div>
      </div>
    </section>

    <!-- Pass-and-play / room setup -->
    <section id="screen-setup" class="screen menu-screen">
      <div class="menu-card setup-card">
        <div class="card-head"><button class="btn btn-ghost btn-small" data-back>‹</button><h2 id="setup-title" data-s="passPlay"></h2></div>
        <div class="field" id="field-myname"><label data-s="yourName"></label><input id="my-name" maxlength="16" autocomplete="off" /></div>
        <div class="field" id="field-players"><label data-s="players"></label>
          <div class="stepper"><button class="btn btn-small btn-blue" id="pc-minus">−</button><span id="pc-value">4</span><button class="btn btn-small btn-blue" id="pc-plus">+</button></div>
          <div class="hint" id="board-info"></div>
        </div>
        <div class="field" id="field-names"><div id="name-list" class="name-list"></div></div>
        <div class="field" id="field-mode"><label data-s="endMode"></label><div id="mode-list" class="mode-list"></div></div>
        <div class="field" id="field-target"><label data-s="wealthTarget"></label><div id="target-list" class="chip-list"></div></div>
        <button class="btn btn-yellow btn-big" id="btn-setup-go" data-s="start"></button>
      </div>
    </section>

    <!-- Join -->
    <section id="screen-join" class="screen menu-screen">
      <div class="menu-card">
        <div class="card-head"><button class="btn btn-ghost btn-small" data-back>‹</button><h2 data-s="joinRoom"></h2></div>
        <div class="field"><label data-s="yourName"></label><input id="join-name" maxlength="16" autocomplete="off" /></div>
        <div class="field"><label data-s="roomCode"></label><input id="join-code" class="code-input" maxlength="5" autocomplete="off" autocapitalize="characters" /></div>
        <div class="error" id="join-error"></div>
        <button class="btn btn-yellow btn-big" id="btn-join-go" data-s="joinRoom"></button>
      </div>
    </section>

    <!-- Lobby -->
    <section id="screen-lobby" class="screen menu-screen">
      <div class="menu-card">
        <div class="card-head"><button class="btn btn-ghost btn-small" id="btn-leave-lobby">‹</button><h2 data-s="lobby"></h2></div>
        <div class="room-code" id="lobby-code"></div>
        <p class="hint center" data-s="shareCode"></p>
        <div class="hint center" id="lobby-settings"></div>
        <ul class="seat-list" id="seat-list"></ul>
        <div class="hint center" id="lobby-status"></div>
        <button class="btn btn-yellow btn-big" id="btn-start-online" data-s="startGame"></button>
      </div>
    </section>

    <!-- Game -->
    <section id="screen-game" class="screen">
      <div id="board"></div>
      <header class="hud-top">
        <div class="mode-chip" id="mode-chip"></div>
        <ol class="feed" id="feed"></ol>
        <button class="btn btn-small btn-ghost icon-btn" id="btn-home" aria-label="Back to my pawn" title="Back to my pawn">📍</button>
        <button class="btn btn-small btn-ghost icon-btn" id="btn-view" aria-label="Whole board or follow players" title="Show the whole board">🗺️</button>
        <button class="btn btn-small btn-ghost icon-btn" id="btn-game-settings" aria-label="Settings">⚙</button>
      </header>
      <aside class="hud-players" id="players"></aside>
      <footer class="hud-actions" id="actions"></footer>
      <button class="rail-toggle rail-toggle-left" id="tog-players" aria-label="Show or hide players"></button>
      <button class="rail-toggle rail-toggle-right" id="tog-actions" aria-label="Show or hide actions"></button>
      <div class="dice-tray hidden" id="dice"></div>
      <button class="turn-bar hidden" id="turn-bar"></button>
      <div class="spotlight hidden" id="spotlight" aria-live="assertive"></div>
    </section>

    <div class="modal hidden" id="modal"><div class="modal-card" id="modal-card"></div></div>
    <div class="handoff hidden" id="handoff"></div>
    <div class="toast-stack" id="toasts"></div>
    <div class="note-stack" id="notes" aria-live="polite"></div>
  </div>
  <script src="/socket.io/socket.io.min.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
